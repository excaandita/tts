$kind: http-example
request:
  url: "{{baseUrl}}/sounds"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "text": "string",
          "voice": "string",
          "voiceName": "string"
        },
        "engine": "Google"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "id": "string"
      }
order: 1000
