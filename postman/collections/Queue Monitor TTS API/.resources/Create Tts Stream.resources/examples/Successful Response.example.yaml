$kind: http-example
request:
  url: "{{baseUrl}}/tts"
  method: POST
  headers:
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "text": "strin",
        "voice": "offline",
        "chime": false,
        "format": "mp3"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "{}"
order: 1000
